name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: pixelvault-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests before packaging
        shell: pwsh
        run: |
          python -m compileall -q src launcher.py
          $env:PYTHONPATH="src"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Las pruebas han fallado" }
      - name: Generate app icon
        run: python scripts/create_icon.py
      - name: Build application with FBX support
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PixelVault --icon assets/pixelvault.ico --add-data "assets/pixelvault.png;assets" --paths src --collect-all PySide6.QtMultimedia --collect-all PySide6.QtMultimediaWidgets --collect-all assimp_py launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller fallo" }
      - name: Install Inno Setup if required
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }
          }
      - name: Build in-place Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\pixelvault.iss'
          if ($LASTEXITCODE -ne 0) { throw "No se pudo generar el Setup" }
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-VAULT-Installer-Windows-v0.3.0
          path: release/*.exe
          if-no-files-found: error
      - name: Publish portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-VAULT-Portable-Windows-v0.3.0
          path: dist/PixelVault.exe
          if-no-files-found: error
      - name: Publish GitHub Release for in-app updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "0.3.0"
          $tag = "v$version"
          $setup = "release/PIXEL-VAULT-Setup-$version.exe"
          if (!(Test-Path $setup)) { throw "No se encontro el instalador" }
          if (gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null) {
            Write-Host "El release $tag ya existe; no se sobrescribe."
            exit 0
          }
          gh release create $tag $setup --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "PIXEL VAULT $version" --notes "Miniaturas FBX y actualizaciones integradas. Instala encima de versiones anteriores; la biblioteca permanece en los datos locales."
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el release" }
