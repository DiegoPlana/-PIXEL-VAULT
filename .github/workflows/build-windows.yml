name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PixelVault --paths src --collect-all PySide6.QtMultimedia --collect-all PySide6.QtMultimediaWidgets launcher.py
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelVault-Windows
          path: dist/PixelVault.exe
          if-no-files-found: error
