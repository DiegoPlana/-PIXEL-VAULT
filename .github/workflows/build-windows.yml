name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Generate visual identity
        run: python scripts/create_icon.py
      - name: Build standalone application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PixelVault --icon assets/pixelvault.ico --add-data "assets/pixelvault.png;assets" --paths src --collect-all PySide6.QtMultimedia --collect-all PySide6.QtMultimediaWidgets launcher.py
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\pixelvault.iss'
      - name: Publish installer
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-VAULT-Installer-Windows-v0.2.0
          path: release/*.exe
          if-no-files-found: error
      - name: Publish portable executable
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-VAULT-Portable-Windows-v0.2.0
          path: dist/PixelVault.exe
          if-no-files-found: error
